<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Home to AirBNB</title>
</head>
<body>
  <header>
    <h1>Register your Home</h1>
  </header>
  <main>
    <p>Fill out the form below to register your home on our platform.</p>
    <form action="/host/add-home" method="POST">
      <label for="homeName">Home Name:</label>
      <input type="text" id="homeName" name="homeName" required>
      <br><br>
      <label for="location">Location:</label>
      <input type="text" id="location" name="location" required>
      <br><br>
      <label for="price">Price per Night:</label>
      <input type="number" id="price" name="price" required>
      <br><br>
      <button type="submit">Add Home</button>
    </form> 
    <br>
    <a href="/">Back to Home</a>
  </main>
</body>
</html>
